<!DOCTYPE html>index.html
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; justify-content: center; align-items: center;
      background: #101010; font-family: Arial, sans-serif; color: white; padding: 20px;
    }


    .falling-background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: -3;
      background: #101010;
    }
    .falling-image {
      position: absolute;
      top: -240px;
      width: 105px;
      height: 105px;
      object-fit: contain;
      opacity: 0.16;
      animation: fall-down 48s linear infinite;
      filter: saturate(1.1);
    }
    .falling-image:nth-child(1) { left: 8%; animation-duration: 55s; animation-delay: -20s; }
    .falling-image:nth-child(2) { left: 43%; animation-duration: 62s; animation-delay: -39s; width: 125px; height: 125px; }
    .falling-image:nth-child(3) { left: 78%; animation-duration: 58s; animation-delay: -12s; width: 95px; height: 95px; }
    @keyframes fall-down {
      from { transform: translateY(-10vh) rotate(-8deg); }
      to { transform: translateY(125vh) rotate(12deg); }
    }

    .site-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-bottom: 22px;
      padding: 12px 0 18px;
    }
    .site-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid transparent;
      background:
        linear-gradient(#101010, #101010) padding-box,
        linear-gradient(90deg, red, orange, yellow, lime, cyan, blue, magenta, red) border-box;
      box-shadow: 0 0 16px rgba(0, 255, 100, 0.25);
    }
    .site-title {
      color: #fff;
      font-size: 42px;
      font-weight: 800;
      letter-spacing: .5px;
      text-align: center;
    }
    @media (max-width: 450px) {
      .site-header { gap: 14px; padding: 10px 0 16px; }
      .site-avatar { width: 108px; height: 108px; }
      .site-title { font-size: 32px; }
    }

    .container {
      width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 38px;
    }
    .menu-item {
      position: relative; display: flex; align-items: center; gap: 25px; width: 100%;
      min-height: 130px; padding: 18px 24px; color: white; text-decoration: none;
      background: #080808; border-radius: 5px; isolation: isolate; transition: transform .25s;
    }
    .menu-item::before {
      content: ""; position: absolute; inset: -3px; border-radius: 7px;
      background: linear-gradient(90deg, red, orange, yellow, lime, cyan, blue, magenta, red);
      background-size: 300% 300%; animation: rgb 4s linear infinite; z-index: -2;
    }
    .menu-item::after {
      content: ""; position: absolute; inset: 0; background: #080808;
      border-radius: 5px; z-index: -1;
    }
    .menu-item:hover { transform: scale(1.035); }
    .menu-item img {
      width: 92px; height: 92px; object-fit: cover; border-radius: 4px;
      background: #171717; flex-shrink: 0;
    }
    .menu-item span { font-size: 24px; font-weight: bold; }
    button.menu-item {
      font: inherit;
      text-align: left;
      cursor: pointer;
      border: 0;
    }
    .discord-item { flex-wrap: wrap; }
    .discord-status {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding-left: 140px;
      margin-top: -5px;
      color: #fff;
    }
    .discord-status[hidden] { display: none; }
    .discord-status strong { font-size: 20px; }
    .progress-label { font-size: 15px; color: #cfcfcf; }
    .progress-track {
      width: 100%;
      height: 10px;
      border-radius: 99px;
      overflow: hidden;
      background: #292929;
      border: 1px solid #555;
    }
    .progress-fill {
      display: block;
      width: 0%;
      height: 100%;
      background: #5865f2;
    }
    @keyframes rgb {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }
    @media (max-width: 450px) {
      .menu-item { min-height: 120px; gap: 16px; padding: 15px; }
      .menu-item img { width: 85px; height: 85px; }
      .menu-item span { font-size: 20px; }
    }
  </style>
</head>
